# ─────────────────────────────────────────────
# 7. KONTROLLREGLER FOR KILDEBRUK
# ─────────────────────────────────────────────
kontrollregler:
  før_bruk_i_søknadstekst:
    - "Er kilden 🟢? Hvis ikke — bær ikke setningen på den kilden alene."
    - "Er kilden konsortie-intern? Aldri uavhengig belegg."
    - "Er kilden parkert (⏸)? Ikke ta den inn igjen uten Lars' godkjenning."
    - "Gjentas et tall fra en sekundærkilde? Spor det til primær."
    - "Brukes 'EBA'? Sjekk om det er [EBA_EU2023] (bank) eller [EBA_NO2023] (bygg)."

  state_of_the_art_regler:
    - >
      SoA kartlegger eksisterende kunnskap — det er ikke belegg for
      VERIFIEDs effekt. Skill «metoden finnes» fra «VERIFIED virker».
    - >
      Ingen agent introduserer ny SoA-påstand uten kildegrunnlag fra
      kildebiblioteket, kildedom eller SoA-dokumentet.
    - >
      SINTEF kan primærverifisere [An2020], [GullbrekkenHolme2025],
      [KD2024], [Mecca2023] m.fl. Verifiseringen er beslutningsgrunnlag;
      portstatus endres først etter godkjenning og loggført beslutning.

  eba_kollisjon:
    regel: >
      «EBA» er alltid fullt utskrevet ved første gangs nevnelse.
      [EBA_EU2023] = European Banking Authority (finans).
      [EBA_NO2023] = Entreprenørforeningen Bygg og Anlegg (bygg/klima).
      Nøklene slås aldri sammen.

  kildestatus_endring:
    regel: >
      SINTEF primærverifiserer vitenskapelige kilder. Codex og AGY kan
      kontrollere og registrere en eksplisitt godkjent beslutning, men kan
      ikke avgjøre grensetilfeller selv. Lars godkjenner grensetilfeller.
      Enhver statusendring logges med hvem, hva og hvorfor.

  agentkonsensus:
    regel: Agentkonsensus er aldri belegg. (AGENTS.md kilde-/sannhetsregel 4)

  historiske_dokumenter:
    regel: >
      ipn-hovedokument.md, ipn-samledokument.md og
      ipn-prosjektbeskrivelse-utkast.md gjøres ikke gjeldende igjen.
      De er støtte- og referanselag.

