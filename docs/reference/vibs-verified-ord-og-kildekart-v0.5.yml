# ─────────────────────────────────────────────
# 3. GODKJENT ORDBRUK
# ─────────────────────────────────────────────
godkjent_ordbruk:
  løsningsvalg:
    definisjon: >
      Valget mellom flere mulige løsninger for samme byggeoppgave i
      tilbudsfasen. Bredere enn produktvalg — kan omfatte produkter,
      montering, vedlikehold og forventet levetid.
    kilde: CONTEXT.md (Låst begrepsbruk)
    godkjent_siden: v0.5

  alternativer:
    definisjon: >
      Konkrete valgmuligheter innenfor et løsningsvalg: nyanskaffelse,
      vedlikehold, reparasjon, rehabilitering, ombruk, ulike produkter
      eller utførelsesmåter for samme behov.
    kilde: HANDOFF-godkjent-review 4.1

  VERIFIED:
    definisjon: >
      Et FoU-prosjekt som skal utvikle og teste en felles måte å samle,
      vekte og forklare informasjon om alternative løsninger. Vises i
      et enkelt sammenligningsverktøy.
    kilde: CONTEXT.md
    unngå: at VERIFIED «velger» eller «anbefaler automatisk»

  sammenligning:
    definisjon: >
      En åpen framstilling av fordeler, ulemper, usikkerhet og begrunnelse
      for hvert alternativ. Entreprenør og kunde bruker den sammen;
      entreprenøren har faglig ansvar for tilbudet.
    kilde: CONTEXT.md
    unngå: ["svart boks", "automatisk beslutning"]

  beslutningsstøtte:
    definisjon: >
      Modellen sammenligner, viser forskjeller og usikkerhet, forklarer
      grunnlaget — men tar ikke beslutningen.
    kilde: HANDOFF-godkjent-review 4.2
    unngå: ["automatisk beslutningstaker", "anbefaler", "velger"]

  usikkerhet:
    definisjon: >
      Synlig datakvalitet, manglende data, datagrunnlag og
      forutsetninger — ikke skjult i en totalscore.
    kilde: SoA §6; HANDOFF 4.3
    datastatus_ordlyd: >
      En opplysning mangler, bygger på generelle data, er estimert
      eller er verifisert for den konkrete løsningen.

  teknisk_risiko:
    definisjon: >
      Dokumenterte farer ved et alternativ knyttet til levetid,
      fuktrobusthet, vedlikehold, dokumentasjonskvalitet og egnethet.
      Skal vises separat og ikke skjules bak lavt klimagassutslipp
      eller lav pris.
    kilde: V2 operative regler

  brukerforutsetning:
    definisjon: >
      Informasjonen skal være mulig å bruke i tilbudsfasen uten å
      forutsette fagkunnskap og tid som mange små bedrifter ikke har.
    kilde: CONTEXT.md
    unngå: "spesialister"

  FoU_hull:
    definisjon: >
      Et avgrenset kunnskapsgap som må dokumenteres mot eksisterende
      forskning, metoder og verktøy. Et mulig gap er en FoU-hypotese fram
      til primærkilder og moteksempler er kontrollert.
    kandidater_til_kildesjekk:
      - "koblingen mellom holdbarhet og finansiell risiko"
      - "SMB-atferd og bruk av beslutningsverktøy i norsk tilbudsfase"
    bruk: Ikke framstill kandidatene som bekreftede fraværspåstander før SoA-kontrollen er lukket.

  mulighetsrom:
    definisjon: >
      Brukes om klimaeffekt: norske kilder peker på at tidlige
      materialvalg kan gi et betydelig rom for reduksjon uten
      merkostnad. Ikke et løfte om VERIFIED-effekt.
    kilde: V1 (v0.5), sannhetsserum-oppdatering-v0.5.md

  state_of_the_art:
    definisjon: >
      Eksisterende kunnskap, metoder, standarder og verktøy.
      Brukes bare for å kartlegge hva som finnes og hvor det stopper
      — ikke som belegg for VERIFIEDs effekt. AGY leser og kartlegger;
      AGY introduserer ikke nye påstander om SoA uten eksisterende kildegrunnlag.
    kilde: SoA-dokumentet, kildedom, evidence_matrix

# ─────────────────────────────────────────────
# 4. FORMULERINGER SOM SKAL UNNGÅS
# ─────────────────────────────────────────────
unngå:
  - uttrykk: "produktvalg"
    når: hele løsningen (inkl. montering, vedlikehold, levetid) menes
    anbefalt_erstatning: "løsningsvalg"
    begrunnelse: For smalt; AGENTS.md og CONTEXT.md er eksplisitte.

  - uttrykk: "VERIFIED velger / anbefaler automatisk"
    når: alltid
    anbefalt_erstatning: "VERIFIED viser, sammenligner og forklarer"
    begrunnelse: Bryter beslutningsstøtte-regelen (HANDOFF 4.2, CONTEXT.md).

  - uttrykk: "svart boks"
    når: alltid
    anbefalt_erstatning: "sammenligning med synlig datagrunnlag og usikkerhet"
    begrunnelse: CONTEXT.md, V2 operative regler.

  - uttrykk: "spesialister"
    når: brukes om brukergruppen
    anbefalt_erstatning: '"entreprenør og kunde" eller "ikke-spesialister"'
    begrunnelse: CONTEXT.md brukerforutsetning.

  - uttrykk: "VERIFIED reduserer utslipp / feil / omarbeid / risiko"
    når: brukes som etablert effekt
    anbefalt_erstatning: >
      "VERIFIED skal teste om …" / "prosjektet skal undersøke om …"
    begrunnelse: >
      Ingen kilde bekrefter kausal effekt (evidence_matrix, HANDOFF 14:
      «Ikke skriv at VERIFIED allerede reduserer …»).

  - uttrykk: "[Wiik2025] som bærende primærkilde"
    når: alltid i innsendingsprosa
    anbefalt_erstatning: "[EBA_NO2023] og [KD2024]"
    begrunnelse: >
      ⏸ Parkert 2026-06-28 (Lars). Konsortie-internt uindeksert notat.
      Kildedom §5.3 og §6.2 er eksplisitte.

  - uttrykk: "[SA2018] som bekreftet primærkilde"
    når: i innsendingsprosa uten forbehold
    anbefalt_erstatning: Midlertidig parkert ⏸; gjeninnsett når kilde lokaliseres.
    begrunnelse: >
      Kollisjon mellom kildedom (🟢 rad 24) og kildebibliotek (🟡 ⏸,
      Lars' beslutning 2026-06-28). Se avvik A-01.

  - uttrykk: "[An2021] / [Billio_SAFE261] / [Harerusten2022] som primærnøkler"
    når: alltid
    anbefalt_erstatning: >
      Bruk [An2020] og [Billio2022] innenfor dokumentert omfang.
      Ikke erstatt Harerusten2022 med [SA2018] i innsendingsprosa før
      [SA2018] er lokalisert, åpnet og godkjent gjeninnsatt.
    begrunnelse: Utdaterte/feil nøkler; [SA2018] er fortsatt parkert.

  - uttrykk: "16–20 MNOK som IPN-grense"
    når: alltid
    anbefalt_erstatning: "1–16 MNOK, maks 50 %"
    begrunnelse: Rettet i kildedom §5.5; NFR_IPN2026 [H].

  - uttrykk: "agentkonsensus som belegg"
    når: alltid
    begrunnelse: Eksplisitt forbudt i AGENTS.md kilde-/sannhetsregel 4.

  - uttrykk: "integrasjonsflate om VIBS-plattformen"
    når: inntil dataflyt og arkitektur er nærmere definert
    anbefalt_erstatning: "testflate"
    begrunnelse: HANDOFF 4.4.

  - uttrykk: "forsikring og takst som konkrete hovedspor"
    når: i søknadsteksten
    begrunnelse: Tatt ut i HANDOFF 4.5 og K2-konsistensretting.

# ─────────────────────────────────────────────
# 5. KILDEPORTER OG PROVENANS
# ─────────────────────────────────────────────
kildeporter:
  grønn:
    symbol: "🟢"
    kode: "[H]"
    betyr: >
      Primær eller offisiell-autoritativ kilde åpnet og verifisert
      for den påstanden den støtter. Kan bære en søknadssetning alene.
    forbehold: >
      En kilde kan være 🟢 for én påstand og svakere for en annen
      (jf. EN15978-2026: 🟢 for publisering, ikke for detaljbestemmelser).

  gul:
    symbol: "🟡"
    koder: ["[H*]", "[M]"]
    betyr: >
      Sterk men primær ikke åpnet [H*], eller sekundær/konsortie-intern [M].
      Støtter internt. Åpne primær eller fraser med forbehold før bærende bruk.

  rød:
    symbol: "🔴"
    kode: "[L]"
    betyr: Kun søketreff / metadata. Ikke siterbar.

  parkert:
    symbol: "⏸"
    betyr: >
      Tatt ut av søknadstekst. Bevart i kildebibliotek og hoveddokument.
      Kan gjeninnsettes når kildeporten lukkes (🟢) eller kilden lokaliseres.

provenans:
  primær:
    betyr: Originalkilden selv. Kan bære setning alene hvis 🟢.
  sekundær:
    betyr: Referert via annen kilde / kun sammendrag. Aldri bærende alene.
  konsortie_intern:
    betyr: >
      VIBS'/SINTEFs eget arbeid. Aldri uavhengig belegg.
      Brukes for å hente primærsitater og intern syntese.

